<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08264a">
  <meta name="description" content="Brian's London Daily News — a personal briefing for London, NW3, technology, AI and what to do next.">
  <title>Brian's London Daily News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3f5f7;
      --ink: #101820;
      --muted: #5b6570;
      --rule: #b8c0c8;
      --accent: #bd2b2b;
      --green: #195c4b;
      --navy: #08264a;
      --serif: "Libre Caslon Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      --gutter: clamp(20px, 5.6vw, 56px);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html {
      color-scheme: light;
      scroll-behavior: smooth;
      background: var(--paper);
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    .shell {
      width: min(100%, 1060px);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }

    .masthead {
      padding-top: clamp(26px, 6vw, 54px);
      color: #fff;
      background: var(--navy);
      box-shadow: 0 0 0 100vmax var(--navy);
      clip-path: inset(0 -100vmax);
      text-align: center;
    }

    .brand {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(34px, 6vw, 68px);
      font-weight: 400;
      line-height: .86;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .issue-line {
      margin: 18px 0 23px;
      color: #dbe5ef;
      font-size: clamp(10px, 2.9vw, 14px);
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .issue-line .dot {
      padding: 0 .42em;
      color: var(--accent);
    }

    .issue-rolling {
      margin: -14px 0 20px;
      color: #948a76;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .date-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-block: 1px solid var(--rule);
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      box-shadow: 0 0 0 100vmax var(--paper);
      clip-path: inset(0 -100vmax);
      backdrop-filter: blur(12px);
    }

    .date-tab {
      position: relative;
      min-height: 58px;
      border: 0;
      padding: 8px 6px;
      color: var(--muted);
      background: transparent;
      font: 500 clamp(12px, 3.2vw, 16px)/1.1 var(--sans);
      cursor: pointer;
    }

    .date-tab::after {
      position: absolute;
      right: 17%;
      bottom: -1px;
      left: 17%;
      height: 4px;
      background: var(--accent);
      content: "";
      opacity: 0;
      transform: scaleX(.45);
      transition: opacity 180ms ease, transform 280ms var(--ease);
    }

    .date-tab[aria-selected="true"] {
      color: var(--ink);
      font-weight: 700;
    }

    .date-tab[aria-selected="true"]::after {
      opacity: 1;
      transform: scaleX(1);
    }

    .date-tab:focus-visible,
    .source-link:focus-visible,
    .morning-fact-link:focus-visible,
    .morning-status-link:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent);
      outline-offset: -3px;
    }

    main {
      min-height: 60vh;
    }

    .morning {
      margin-top: 28px;
      border-block: 2px solid var(--ink);
    }

    .morning-title {
      margin: 0;
      padding: 11px 0 9px;
      border-bottom: 1px solid var(--rule);
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .morning-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .morning-fact {
      min-width: 0;
      padding: 13px 10px 12px 0;
      border-bottom: 1px solid var(--rule);
      font-family: var(--serif);
      font-size: clamp(19px, 5.3vw, 24px);
      line-height: 1.1;
    }

    .morning-fact:nth-child(even) {
      padding-left: 14px;
      border-left: 1px solid var(--rule);
    }

    .morning-fact-link {
      color: inherit;
      text-underline-offset: 3px;
    }

    .morning-transit {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      min-height: 48px;
      border-bottom: 1px solid var(--rule);
      font-size: 16px;
    }

    .service-good {
      color: var(--green);
      font-weight: 700;
    }

    .service-check {
      color: var(--accent);
      font-weight: 700;
    }

    .morning-status-link {
      text-underline-offset: 3px;
    }

    .briefing {
      animation: reveal 460ms var(--ease) both;
    }

    .briefing[hidden] { display: none; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .story {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 24px 0 27px;
      border-bottom: 1px solid var(--rule);
    }

    .story:first-of-type {
      padding-top: 30px;
    }

    .story-media {
      position: relative;
      order: 2;
      margin: 0;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #e9e9e6;
    }

    .story-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 700ms var(--ease);
    }

    .story:hover .story-media img {
      transform: scale(1.018);
    }

    .story-copy {
      display: contents;
    }

    .story-heading {
      order: 1;
    }

    .story-index {
      display: inline-block;
      margin-right: 10px;
      color: var(--accent);
      font-family: var(--serif);
      font-size: clamp(35px, 10vw, 48px);
      line-height: .8;
      vertical-align: -.12em;
    }

    .section-label {
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .story h2 {
      margin: 10px 0 0;
      font-family: var(--serif);
      font-size: clamp(34px, 9.7vw, 56px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.028em;
    }

    .story-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-top: 14px;
      color: #30302d;
      font-size: 13px;
      font-weight: 700;
    }

    .story-location {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .story-location::before {
      width: 7px;
      height: 7px;
      border: 2px solid var(--green);
      border-radius: 50%;
      content: "";
    }

    .action-label {
      padding: 4px 8px 3px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .action-plain {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .action-link {
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      transition: color 160ms ease, background-color 160ms ease;
    }

    .action-link:hover {
      color: var(--paper);
      background: var(--accent);
    }

    .action-link:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent);
      outline-offset: 3px;
    }

    .action-plain {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .story-body {
      order: 3;
      font-size: clamp(18px, 5vw, 20px);
      line-height: 1.5;
    }

    .story-body p {
      margin: 0 0 9px;
    }

    .story-body strong {
      font-weight: 700;
    }

    .why {
      padding-left: 11px;
      border-left: 2px solid var(--accent);
    }

    .why strong {
      color: var(--accent);
    }

    .source-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 16px;
      margin-top: 15px;
      font-size: 12px;
      font-weight: 600;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      text-underline-offset: 3px;
    }

    .source-link::after {
      width: 7px;
      height: 7px;
      border-top: 1.5px solid currentColor;
      border-right: 1.5px solid currentColor;
      content: "";
      transform: rotate(45deg);
    }

    .issue-footer {
      padding: 30px 0 36px;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .site-footer {
      margin: 8px 0 44px;
      border-block: 1px solid var(--rule);
    }

    .site-footer-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .site-footer-link {
      display: flex;
      min-height: 66px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .22em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .site-footer-link + .site-footer-link {
      border-left: 1px solid var(--rule);
      padding-left: clamp(14px, 3vw, 28px);
    }

    .site-footer-link::after {
      color: var(--accent);
      content: "↗";
      font-size: 18px;
    }

    .site-footer-link:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent);
      outline-offset: 3px;
    }

    .image-credit {
      position: absolute;
      right: 7px;
      bottom: 6px;
      padding: 3px 5px;
      color: #fff;
      background: rgb(0 0 0 / .58);
      font-size: 8px;
      line-height: 1;
      letter-spacing: .03em;
    }

    @media (min-width: 720px) {
      .brand {
        white-space: nowrap;
      }

      .morning {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) minmax(250px, .8fr);
        align-items: stretch;
      }

      .morning-title {
        display: flex;
        align-items: center;
        min-width: 145px;
        border-right: 1px solid var(--rule);
        border-bottom: 0;
        padding-right: 24px;
      }

      .morning-facts {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .morning-fact {
        display: flex;
        align-items: center;
        padding: 12px 14px;
        border-right: 1px solid var(--rule);
        border-bottom: 0;
        font-size: 17px;
      }

      .morning-fact:nth-child(even) {
        border-left: 0;
      }

      .morning-network {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .morning-transit {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 3px;
        min-height: 0;
        padding: 8px 14px;
        border-bottom: 0;
        font-size: 12px;
      }

      .morning-transit + .morning-transit {
        border-left: 1px solid var(--rule);
      }

      .story:not(:first-of-type) {
        grid-template-columns: minmax(250px, .84fr) minmax(0, 1fr);
        gap: 30px;
        align-items: center;
      }

      .story:not(:first-of-type) .story-copy {
        display: block;
      }

      .story:not(:first-of-type) .story-media {
        order: 1;
      }

      .story:not(:first-of-type) .story-heading,
      .story:not(:first-of-type) .story-body {
        order: initial;
      }

      .story:not(:first-of-type) h2 {
        font-size: clamp(31px, 4vw, 43px);
      }

      .story:not(:first-of-type) .story-index {
        font-size: 39px;
      }

      .story:first-of-type {
        grid-template-columns: minmax(0, 1fr) minmax(350px, 1.2fr);
        gap: 24px 34px;
      }

      .story:first-of-type .story-heading {
        align-self: end;
      }

      .story:first-of-type .story-media {
        order: 1;
        grid-column: 2;
        grid-row: 1 / 3;
        min-height: 420px;
        aspect-ratio: auto;
      }

      .story:first-of-type .story-body {
        order: 2;
        grid-column: 1;
      }
    }

    @media (max-width: 620px) {
      .site-footer-nav {
        grid-template-columns: 1fr;
      }

      .site-footer-link + .site-footer-link {
        border-top: 1px solid var(--rule);
        border-left: 0;
        padding-left: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    const escapeHtml = value => value.replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);

    function renderMorning(morning) {
      if (!morning) return "";

      const facts = [
        [morning.mode, morning.modeUrl],
        [morning.temperature, morning.weatherUrl],
        [morning.rain],
        [morning.pollen]
      ]
        .map(([fact, url]) => {
          const externalAttributes = /^https?:\/\//i.test(url || "")
            ? ' target="_blank" rel="noopener noreferrer"'
            : "";
          return `<div class="morning-fact">${
            url
              ? `<a class="morning-fact-link" href="${url}"${externalAttributes}>${escapeHtml(fact)}</a>`
              : escapeHtml(fact)
          }</div>`;
        })
        .join("");
      const transit = morning.transit.map(([line, status, tone, url]) => `
        <div class="morning-transit">
          <span>${escapeHtml(line)}</span>
          <a class="morning-status-link service-${escapeHtml(tone)}" href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(status)}</a>
        </div>
      `).join("");

      return `
        <aside class="morning" aria-label="Your morning at a glance">
          <h2 class="morning-title">Your morning</h2>
          <div class="morning-facts">${facts}</div>
          <div class="morning-network">
            ${transit}
          </div>
        </aside>
      `;
    }

    function renderStory(story, index) {
      const sources = story.sources.map(([name, url]) =>
        `<a class="source-link" href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(name)}</a>`
      ).join("");
      const requiresActionUrl = ["Book", "Participate"].includes(story.action);
      if (requiresActionUrl && !story.actionUrl) {
        console.warn(`Story ${story.id} is missing a direct actionUrl for ${story.action}.`);
      }
      const action = story.action
        ? requiresActionUrl && story.actionUrl
          ? `<a class="action-label action-link" href="${escapeHtml(story.actionUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(story.action)}: ${escapeHtml(story.headline)}">${escapeHtml(story.action)}</a>`
          : requiresActionUrl
            ? ""
            : `<span class="action-plain">${escapeHtml(story.action)}</span>`
        : "";

      return `
        <article class="story" data-story-id="${escapeHtml(story.id)}">
          <div class="story-copy">
            <header class="story-heading">
              <span class="story-index">${String(index + 1).padStart(2, "0")}</span>
              <span class="section-label">${escapeHtml(story.section)}</span>
              <h2>${escapeHtml(story.headline)}</h2>
              <div class="story-meta">
                <span class="story-location">${escapeHtml(story.location)}</span>
                ${action}
              </div>
            </header>
            <div class="story-body">
              <p><strong>Executive brief:</strong> ${escapeHtml(story.brief)}</p>
              <p class="why"><strong>Why it matters:</strong> ${escapeHtml(story.why)}</p>
              <div class="source-list" aria-label="Sources">${sources}</div>
            </div>
          </div>
          <figure class="story-media">
            <img src="${story.image.src}" alt="${escapeHtml(story.image.alt)}" loading="${index === 0 ? "eager" : "lazy"}" referrerpolicy="no-referrer">
            <figcaption class="image-credit">${escapeHtml(story.image.credit)}</figcaption>
          </figure>
        </article>
      `;
    }

    Object.entries(issues).forEach(([day, issue]) => {
      const panel = document.getElementById(day);
      panel.innerHTML = renderMorning(issue.morning) +
        issue.stories.map(renderStory).join("") +
        `<footer class="issue-footer">${escapeHtml(issue.footer)}</footer>`;
    });

    function assertNoAdjacentRepeats() {
      const order = ["today", "yesterday", "day-before"];
      order.slice(0, -1).forEach((day, index) => {
        const currentIds = new Set(issues[day].stories.map(story => story.id));
        const previousDay = order[index + 1];
        const repeated = issues[previousDay].stories
          .filter(story => currentIds.has(story.id))
          .map(story => story.id);
        if (repeated.length) {
          throw new Error(`Repeated story IDs across ${day} and ${previousDay}: ${repeated.join(", ")}`);
        }
      });
    }

    assertNoAdjacentRepeats();

    const tabs = [...document.querySelectorAll(".date-tab")];
    const panels = [...document.querySelectorAll(".briefing")];
    const issueLine = document.getElementById("issue-line");

    function selectDay(day, { focus = false } = {}) {
      tabs.forEach(tab => {
        const selected = tab.dataset.day === day;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
        if (selected && focus) tab.focus();
      });
      panels.forEach(panel => { panel.hidden = panel.id !== day; });
      issueLine.innerHTML = issues[day].label.replace(" • ", ' <span class="dot">•</span> ');
      history.replaceState(null, "", day === "today" ? location.pathname : `#${day}`);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectDay(tab.dataset.day));
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const step = event.key === "ArrowRight" ? 1 : -1;
        const next = tabs[(index + step + tabs.length) % tabs.length];
        selectDay(next.dataset.day, { focus: true });
      });
    });

    const initialDay = location.hash.slice(1);
    if (issues[initialDay]) selectDay(initialDay);
  </script>
