name: Collect London news candidates

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: london-news-candidates
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Collect candidate stories
        run: python scripts/collect_candidates.py

      - name: Refresh direct activity listings
        run: node --use-env-proxy scripts/collect_sources.mjs

      - name: Prepare compact daily brief
        run: node scripts/prepare_daily_brief.mjs

      - name: Commit discovery files
        run: |
          git config user.name "london-news-candidate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rss_candidates.json data/direct-candidates.json data/daily-brief.json data/reading-brief.json
          git diff --quiet --cached || git commit -m "Refresh London news candidates"
          # Refuse to overwrite a concurrent publication. A fresh run can retry.
          git push origin HEAD:main
